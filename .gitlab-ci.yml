---
# GitLab CI/CD Pipeline for fts-storage
# SPDX-License-Identifier: Apache-2.0
#
# Reusable components live in gitlab.com/devnw/ci-catalog.
# Zig components pinned at v1.22.0 (first tag with multi-OS + test_step
# + bounded zig-fuzz). Security/SBOM components stay on their existing
# pins since those APIs haven't changed.
#
# Linux jobs run on company-tagged runners. macOS jobs use GitLab SaaS
# (`saas-macos-medium-m1`); Windows jobs use the self-hosted company
# runner group (`company` + `windows` tags). Cross-OS jobs are gated
# behind rules + allow_failure so pipelines without those runners still
# pass. Trigger cross-OS runs by setting RUN_CROSS_OS=true or by
# scheduling / merging to the default branch.

# Cancel in-flight pipelines on new commits for everything except
# release-producing runs (tag pipelines and default-branch pipelines,
# which feed `release-semantic`). All jobs default to interruptible so
# the auto-cancel actually kicks in; opt out per-job when needed.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
  - if: '$CI_COMMIT_TAG'
    auto_cancel:
      on_new_commit: none
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    auto_cancel:
      on_new_commit: none
  - when: always

default:
  interruptible: true
  tags:
  - company
  - linux

include:
  # SEC-08 / SEC-EXT-0503: catalog components currently pinned to mutable semver
  # tags. SHA-pinning requires upstream devnw/ci-catalog to publish immutable
  # refs. Tracked as Won't-Do in docs/SECURITY_GAP_ANALYSIS.md.
  # Security scanning
- component: gitlab.com/devnw/ci-catalog/security-sast@v1.50.0
- component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.50.0
- component: gitlab.com/devnw/ci-catalog/security-secrets@v1.50.0
- component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.50.0

  # SBOM
- component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.50.0
- component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.50.0

  # Release
- component: gitlab.com/devnw/ci-catalog/release-semantic@v1.50.0

  # Zig formatting (Linux).
- component: gitlab.com/devnw/ci-catalog/zig-format@v1.50.0
  inputs:
    zig_version: "0.16.0"
    # DO-4: include benchmarks/ and build.zig so the formatter covers every
    # checked-in Zig source, not just the library + tests + examples.
    paths: "src/ tests/ examples/ benchmarks/ build.zig"

  # Zig build (Linux): static lib + CLI + check-compile.
- component: gitlab.com/devnw/ci-catalog/zig-build@v1.50.0
  inputs:
    stage: build
    zig_version: "0.16.0"
    build_options: "build check"

  # Zig tests — Linux matrix across optimize modes + integration + stress.
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-debug"
    test_step: "test"
    optimize: "Debug"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-releasesafe"
    test_step: "test"
    optimize: "ReleaseSafe"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-releasefast"
    test_step: "test"
    optimize: "ReleaseFast"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-releasesmall"
    test_step: "test"
    optimize: "ReleaseSmall"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-integration"
    test_step: "test-integration"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-stress"
    test_step: "test-stress"

  # Fuzz sweep (SEC-EXT-0504, advisory). fuzz_duration is the in-shell SIGINT
  # budget; timeout: is GitLab's job cap. Pairs with the deterministic
  # adversarial-corpus harness in tests/fuzz_targets.zig (run locally via
  # `zig build test-fuzz`) — that file enumerates the public deserializers
  # this sweep should exercise (Manifest.deserialize, WalRecord.deserialize,
  # readVarInt). allow_failure stays true while the budget is bounded to
  # 60s on every push; promotion to a required gate is tracked alongside
  # a default-branch nightly extension.
- component: gitlab.com/devnw/ci-catalog/zig-fuzz@v1.50.0
  inputs:
    zig_version: "0.16.0"
    test_step: "test"
    test_options: "--fuzz"
    fuzz_duration: "60"
    timeout: "5m"
    allow_failure: true

  # Zig build + tests on macOS (gated).
- component: gitlab.com/devnw/ci-catalog/zig-build-macos@v1.50.0
  inputs:
    zig_version: "0.16.0"
    build_step: "build"
    build_options: "check"
- component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit"
    test_step: "test"
- component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-integration"
    test_step: "test-integration"
- component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-stress"
    test_step: "test-stress"

  # Zig build + tests on Windows (gated). tags override routes these to
  # the self-hosted company Windows runner group; remove the override
  # once ci-catalog >v1.22.0 lands and bakes the new default in.
- component: gitlab.com/devnw/ci-catalog/zig-build-windows@v1.50.0
  inputs:
    zig_version: "0.16.0"
    build_step: "build"
    build_options: "check"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit"
    test_step: "test"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-integration"
    test_step: "test-integration"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.50.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-stress"
    test_step: "test-stress"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.50.0

variables:
  ZIG_VERSION: "0.16.0"
  # This is a pure library: no container image is ever built or pushed, so
  # the security component's bundled container scan can only ever fail with
  # "image could not be found". Documented switch for the GitLab template.
  CONTAINER_SCANNING_DISABLED: "true"

stages:
- lint
- build
- test
- fuzz
- performance
- security
- sbom
- release

# ---------------------------------------------------------------
# Cross-OS gating: apply rules to the catalog-generated jobs so
# macOS / Windows only run on default branch, schedule, or when
# RUN_CROSS_OS=true. Elsewhere they fall back to manual.
# ---------------------------------------------------------------

.cross-os-rules: &cross-os-rules
- if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
- if: '$CI_PIPELINE_SOURCE == "schedule"'
- if: '$RUN_CROSS_OS == "true"'
- when: manual
  allow_failure: true

zig-build-macos-0.16.0:
  rules: *cross-os-rules

zig-test-macos-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]

zig-test-macos-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]

zig-test-macos-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]

zig-build-windows-0.16.0:
  rules: *cross-os-rules

zig-test-windows-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]

zig-test-windows-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]

zig-test-windows-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]

# ---------------------------------------------------------------
# Benchmark regression gating.
#
# The default `bench` step runs the suite defined in
# benchmarks/bench.zig and writes JSON to benchmarks/results/. The
# `compare-bench` step diffs that against benchmarks/results/baseline.json
# and exits non-zero on a regression beyond the noise gate (default
# floor 15%). Both jobs install Zig directly via scripts/install-zig.sh
# on a stock ubuntu:24.04 image so the benchmark machine matches the
# build matrix above without depending on a catalog image bump.
#
# Gated to default branch / schedule / RUN_BENCH=true; advisory until
# a real baseline lands (allow_failure: true in benchmark-regression).
# Drop allow_failure once baseline.json reflects a stable release.
# ---------------------------------------------------------------

.zig-host-base:
  image: "ubuntu:26.04"
  interruptible: true
  before_script:
  - apt-get update -qq
  # wget + sudo: required by scripts/install-openssl-fips.sh (canonical copy
  # from devnw/zig/fips — it fetches/verifies OpenSSL via wget and installs
  # via sudo; kept unpatched to stay byte-identical with upstream, and sudo
  # as root in the container is a no-op wrapper).
  - apt-get install -y --no-install-recommends curl wget sudo gnupg ca-certificates xz-utils git build-essential python3 perl
  - bash scripts/install-zig.sh "$ZIG_VERSION"
  - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
  - zig version

.bench-rules: &bench-rules
- if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
- if: '$CI_PIPELINE_SOURCE == "schedule"'
- if: '$RUN_BENCH == "true"'
- when: manual
  allow_failure: true

# ---------------------------------------------------------------
# Sanitizer build (SEC-EXT-0605). Re-runs unit + integration with
# -Dasan=true so the max-safety toggle is exercised on every push.
# Advisory while we wait for upstream Zig to expose
# Module.sanitize_address; promote to a required gate once the
# rest of the safety axis ships.
# ---------------------------------------------------------------
test-asan:
  extends: .zig-host-base
  stage: test
  script:
  - zig build test --summary all -Dasan=true
  - zig build test-integration --summary all -Dasan=true
  allow_failure: true

benchmark-regression:
  extends: .zig-host-base
  stage: performance
  rules: *bench-rules
  # Advisory (the posture the header comment above always prescribed):
  # measured cross-run variance on the shared runners is ±45% for identical
  # code within one cpu class (2026-07-10, pipelines 2668163641 vs
  # 2668230536: engine_init_cycle +45% while posting_iter -34%, same sha,
  # stddev_pct 2-4%) — noisy neighbors swamp any real regression. The
  # cpu-aware compare gate still prints per-scenario deltas for humans;
  # promote back to blocking only on a dedicated, isolated bench runner.
  allow_failure: true
  script:
  - mkdir -p benchmarks/results
  - zig build bench -- --output benchmarks/results/ci-current.json
  - |
    if [ -f benchmarks/results/baseline.json ]; then
      zig build compare-bench -- --baseline benchmarks/results/baseline.json --current benchmarks/results/ci-current.json
    else
      echo "no benchmarks/results/baseline.json yet; skipping regression gate"
    fi
  artifacts:
    when: always
    paths:
    - benchmarks/results/ci-current.json
    expire_in: 30 days
  # WRK-024 / PERF-0026, GAP-0008: baseline.json is now committed, so the
  # regression gate is enforced (previously `allow_failure: true` while the
  # baseline was being established).

bench-micro:
  extends: .zig-host-base
  stage: performance
  rules: *bench-rules
  script:
  - zig build bench-micro
  allow_failure: true # advisory; thresholds aren't gated yet

scale-bench:
  extends: .zig-host-base
  stage: performance
  rules:
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - when: manual
    allow_failure: true
  script:
  - mkdir -p benchmarks/results
  - timeout 300 zig build scale-bench -- --output benchmarks/results/scale-current.json
  artifacts:
    when: always
    paths:
    - benchmarks/results/scale-current.json
    expire_in: 30 days

# ---------------------------------------------------------------------------
# FIPS-140-3 dual-mode test (-Dfips=true).
#
# `fips-deps` builds the latest OpenSSL 3.x + FIPS provider into
# /usr/local/ssl (via the repo `make deps` target, which the ci-catalog
# `zig-fips-build` component also provides). `test-fips` then runs the suite
# against the validated FIPS backend. Linux-only; MR + default-branch.
fips-deps:
  extends: .zig-host-base
  stage: build
  script:
    # GitLab artifacts must live under $CI_PROJECT_DIR — /usr/local/ssl is
    # outside the project dir and cannot be uploaded, so build into a
    # project-relative prefix instead (still handed to test-fips below).
    # OPENSSL_VERSION pinned: the script's "latest 3.x" resolver greps
    # releases/latest for an openssl-3.* tag, but the latest release is now
    # the 4.x line, so the grep silently falls back to the system OpenSSL
    # (3.0.13 — no ML-KEM, fails verify-fips-provider.sh). Bump this pin
    # alongside OpenSSL 3.x LTS releases. Same latent bug flagged upstream
    # in devnw/zig/fips' copy of the resolver.
    - OPENSSL_PREFIX="$CI_PROJECT_DIR/.openssl-fips" OPENSSL_VERSION="3.6.3" make deps
  artifacts:
    paths:
      - .openssl-fips/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test-fips:
  extends: .zig-host-base
  stage: test
  script:
    - OPENSSL_CONF="$CI_PROJECT_DIR/.openssl-fips/ssl/openssl.cnf" zig build test -Dfips=true -Dopenssl_path="$CI_PROJECT_DIR/.openssl-fips" --summary all
  needs:
    - fips-deps
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
