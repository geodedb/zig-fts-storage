# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "fts-storage Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    '''\.zig-cache''',
    '''zig-out''',
    '''\.git''',
]
regexes = [
    # OpenSSL release-signing PGP key FINGERPRINTS — public data (published
    # at https://www.openssl.org/source/), pinned by
    # scripts/install-openssl-fips.sh to verify tarball AUTHENTICITY.
    # gitleaks' generic-api-key rule matches any long hex constant; these are
    # verification anchors, not credentials. Scoped to the exact variable
    # names so real 40-hex secrets elsewhere still trip the rule.
    '''OPENSSL_RELEASE_KEY_(CURRENT|PREVIOUS)="[0-9A-F]{40}"''',
]

# Add custom rules or allowlist entries as needed
# [[rules]]
# id = "custom-rule"
# description = "Custom secret pattern"
# regex = '''pattern'''
