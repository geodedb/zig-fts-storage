# Pre-commit configuration
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
  # Standard pre-commit hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^\.gitlab/
  - id: end-of-file-fixer
    exclude: ^\.gitlab/
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: check-toml
  - id: check-xml
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
  - id: detect-private-key

  # Shell linting
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error]

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]
    exclude: ^CHANGELOG\.md$

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^\.gitlab-ci\.yml$

  # Conventional commits
- repo: https://github.com/commitizen-tools/commitizen
  rev: 3f5ccc87b27966d9ed21cf5ea8ec2fba38ca65ce  # frozen: v4.19.0
  hooks:
  - id: commitizen
    stages: [commit-msg]

  # Local Zig hooks — pin to the project's zig version via mise so local
  # zig-build and zig-fmt do not drift when the host's default zig differs.
- repo: local
  hooks:
  - id: zig-fmt
    name: zig fmt (check)
    entry: mise x zig@0.16.0 -- zig fmt --check
    language: system
    files: \.zig$
    pass_filenames: false
    args: [src/, tests/, examples/, benchmarks/, build.zig]

  - id: zig-build
    name: zig build (check)
    entry: mise x zig@0.16.0 -- zig build check
    language: system
    pass_filenames: false
    files: \.zig$

  - id: zig-test
    name: zig test
    entry: mise x zig@0.16.0 -- zig build test
    language: system
    pass_filenames: false
    files: \.zig$
    stages: [pre-push]

  - id: check-todos
    name: check TODOs
    entry: >
      bash -c 'if grep -rn "TODO\|FIXME\|HACK\|XXX" src/ tests/
      --include="*.zig" 2>/dev/null; then echo "Warning: Found
      TODO/FIXME markers"; fi; exit 0'
    language: system
    pass_filenames: false
    verbose: true

- repo: local
  hooks:
  - id: detect-diamond-deps
    name: detect diamond deps in build.zig.zon
    entry: uvx --refresh --from git+https://gitlab.com/devnw/zig/zig-tool detect-diamond-deps
    language: system
    files: ^build\.zig\.zon$
    pass_filenames: false
  - id: check-version-tag
    name: release tag matches build.zig.zon version
    entry: uvx --refresh --from git+https://gitlab.com/devnw/zig/zig-tool zig-tool check-version-tag
    language: system
    stages: [pre-push]
    pass_filenames: false
    always_run: true
ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  skip: [zig-fmt, zig-build, zig-test]
